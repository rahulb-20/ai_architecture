name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Unit + integration tests
        run: pytest
      - name: Eval gate (golden set, offline fake LLM)
        run: python -m aiarch.evaluation.runner --gate --out reports/eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-py${{ matrix.python }}
          path: reports/eval.json

  container:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aiarch:ci .
      - name: Smoke test
        run: |
          docker run -d --name api -p 8000:8000 aiarch:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/healthz && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/ask -H 'content-type: application/json' \
            -d '{"question":"How often do VPN passwords expire?"}' | tee /dev/stderr | grep -q '"answered"'
