<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Request lifecycle: prompt tokens go through parallel prefill into a KV cache, then a sequential decode loop through a sampler emits tokens" role="img" style="background:#ffffff" viewbox="0 0 760 290" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"></path></marker>
</defs>
<g fill="#555" font-family="JetBrains Mono, monospace" font-size="12">
<!-- prompt -->
<text fill="#555" font-size="11" x="16" y="30">PROMPT (n_in tokens)</text>
<g fill="#555" stroke="#555">
<rect height="22" rx="3" width="26" x="16" y="42"></rect><rect height="22" rx="3" width="26" x="46" y="42"></rect><rect height="22" rx="3" width="26" x="76" y="42"></rect><rect height="22" rx="3" width="26" x="106" y="42"></rect><rect height="22" rx="3" width="26" x="136" y="42"></rect><rect height="22" rx="3" width="26" x="166" y="42"></rect>
</g>
<!-- prefill -->
<rect fill="#555" height="74" rx="6" stroke="#555" stroke-width="1.5" width="200" x="16" y="96"></rect>
<text font-weight="600" x="30" y="120">PREFILL</text>
<text fill="#555" font-size="11" x="30" y="140">all tokens in parallel</text>
<text fill="#555" font-size="11" x="30" y="158">compute-bound → TTFT</text>
<line marker-end="url(#ar)" stroke="#555" x1="104" x2="104" y1="68" y2="92"></line>
<!-- KV cache -->
<rect fill="#555" height="74" rx="6" stroke="#555" stroke-width="1.5" width="190" x="270" y="96"></rect>
<text font-weight="600" x="284" y="120">KV CACHE</text>
<text fill="#555" font-size="11" x="284" y="140">2·L·H_kv·d·bytes / token</text>
<text fill="#555" font-size="11" x="284" y="158">grows with ctx × users</text>
<line marker-end="url(#ar)" stroke="#555" x1="218" x2="266" y1="133" y2="133"></line>
<!-- decode -->
<rect fill="#555" height="74" rx="6" stroke="#555" stroke-width="1.5" width="230" x="514" y="96"></rect>
<text font-weight="600" x="528" y="120">DECODE (loop)</text>
<text fill="#555" font-size="11" x="528" y="140">1 token / forward pass</text>
<text fill="#555" font-size="11" x="528" y="158">bandwidth-bound → TPOT</text>
<line marker-end="url(#ar)" stroke="#555" x1="462" x2="510" y1="133" y2="133"></line>
<!-- sampler -->
<rect fill="#555" height="64" rx="6" stroke="#555" width="230" x="514" y="206"></rect>
<text font-weight="600" x="528" y="228">SAMPLER</text>
<text fill="#555" font-size="11" x="528" y="248">logits ÷ T → top-k → top-p/min-p</text>
<text fill="#555" font-size="11" x="528" y="262">→ draw (seed) → stop?</text>
<path d="M700,172 L700,202" fill="none" marker-end="url(#ar)" stroke="#555"></path>
<path d="M560,204 C560,188 560,188 560,174" fill="none" marker-end="url(#ar)" stroke="#555" stroke-dasharray="4 3"></path>
<text fill="#555" font-size="11" x="420" y="196">new token appended → next step</text>
<!-- output -->
<text fill="#555" font-size="11" x="270" y="232">STREAMED OUTPUT (n_out)</text>
<g fill="#555" stroke="#555"><rect height="22" rx="3" width="26" x="270" y="242"></rect><rect height="22" rx="3" width="26" x="300" y="242"></rect><rect height="22" rx="3" width="26" x="330" y="242"></rect></g>
<line marker-end="url(#ar)" stroke="#555" x1="510" x2="362" y1="250" y2="252"></line>
<!-- latency equation -->
<text font-weight="600" x="16" y="214">latency ≈</text>
<text fill="#555" font-size="11" x="16" y="234">queue + net</text>
<text fill="#555" font-size="11" x="16" y="250">+ n_in_uncached / prefill_tps</text>
<text fill="#555" font-size="11" x="16" y="266">+ n_out / decode_tps</text>
</g>
</svg>