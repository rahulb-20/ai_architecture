<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" style="background:#ffffff" viewbox="0 0 720 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"></path></marker></defs>
<g fill="#555" font-size="13">
<rect fill="#555" height="50" rx="8" stroke="#555" width="220" x="250" y="12"></rect>
<text font-weight="600" text-anchor="middle" x="360" y="33">Prompt + golden eval set</text>
<text fill="#555" font-size="12" text-anchor="middle" x="360" y="51">baseline first, measure the gap</text>
<line marker-end="url(#ar)" stroke="#555" x1="360" x2="360" y1="62" y2="92"></line>
<rect fill="#555" height="44" rx="22" stroke="#555" width="220" x="250" y="94"></rect>
<text font-weight="600" text-anchor="middle" x="360" y="121">What is missing?</text>
<line marker-end="url(#ar)" stroke="#555" x1="270" x2="120" y1="138" y2="182"></line>
<line marker-end="url(#ar)" stroke="#555" x1="360" x2="360" y1="138" y2="182"></line>
<line marker-end="url(#ar)" stroke="#555" x1="450" x2="600" y1="138" y2="182"></line>
<text fill="#555" font-size="12" text-anchor="middle" x="165" y="152">knowledge</text>
<text fill="#555" font-size="12" text-anchor="middle" x="395" y="165">both</text>
<text fill="#555" font-size="12" text-anchor="middle" x="560" y="152">behaviour</text>
<rect fill="#555" height="74" rx="8" stroke="#555" width="200" x="20" y="184"></rect>
<text font-weight="600" text-anchor="middle" x="120" y="207">RAG</text>
<text fill="#555" font-size="12" text-anchor="middle" x="120" y="226">fresh, cited, ACL-filtered</text>
<text fill="#555" font-size="12" text-anchor="middle" x="120" y="243">facts at query time</text>
<rect fill="#555" height="74" rx="8" stroke="#555" width="200" x="260" y="184"></rect>
<text font-weight="600" text-anchor="middle" x="360" y="207">RAG + tuned reader</text>
<text fill="#555" font-size="12" text-anchor="middle" x="360" y="226">RAFT-style: train the model</text>
<text fill="#555" font-size="12" text-anchor="middle" x="360" y="243">to use/ignore context</text>
<rect fill="#555" height="74" rx="8" stroke="#555" width="200" x="500" y="184"></rect>
<text font-weight="600" text-anchor="middle" x="600" y="207">PEFT (LoRA / QLoRA)</text>
<text fill="#555" font-size="12" text-anchor="middle" x="600" y="226">format, tone, task skill,</text>
<text fill="#555" font-size="12" text-anchor="middle" x="600" y="243">shorter prompts, smaller model</text>
<line marker-end="url(#ar)" stroke="#555" x1="600" x2="600" y1="258" y2="282"></line>
<rect fill="#555" height="38" rx="8" stroke="#555" width="240" x="470" y="284"></rect>
<text font-size="12.5" text-anchor="middle" x="590" y="308">Full FT / continued pretraining (rare)</text>
<text fill="#555" font-size="12" x="20" y="306">Each step right/down costs more to build, operate and re-do when the base model changes.</text>
</g>
</svg>