<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Request path from client through gateway to FastAPI pod with LCEL chain and model endpoint" height="250" role="img" style="background:#ffffff" viewbox="0 0 820 250" width="820" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0L10,5L0,10z" fill="#555"></path></marker></defs>
<g fill="#555" font-size="12">
<rect fill="#555" height="60" rx="6" stroke="#555" width="110" x="10" y="80"></rect>
<text text-anchor="middle" x="65" y="106">Client</text><text fill="#555" text-anchor="middle" x="65" y="124">EventSource</text>
<rect fill="#555" height="60" rx="6" stroke="#555" width="140" x="160" y="80"></rect>
<text text-anchor="middle" x="230" y="106">API gateway / LB</text><text fill="#555" text-anchor="middle" x="230" y="124">idle timeout, gzip</text>
<rect fill="none" height="170" rx="8" stroke="#555" stroke-dasharray="5 4" width="300" x="340" y="30"></rect>
<text fill="#555" x="352" y="50">container (non-root, 1 uvicorn proc)</text>
<rect fill="#555" height="60" rx="6" stroke="#555" width="120" x="360" y="80"></rect>
<text text-anchor="middle" x="420" y="106">FastAPI</text><text fill="#555" text-anchor="middle" x="420" y="124">EventSourceResp.</text>
<rect fill="#555" height="60" rx="6" stroke="#555" width="125" x="500" y="80"></rect>
<text text-anchor="middle" x="562" y="100">LCEL chain</text><text fill="#555" text-anchor="middle" x="562" y="118">prompt|llm|</text><text fill="#555" text-anchor="middle" x="562" y="133">parser .astream()</text>
<rect fill="#555" height="28" rx="4" stroke="#555" width="265" x="360" y="160"></rect>
<text fill="#555" text-anchor="middle" x="492" y="179">/healthz (liveness) · /readyz (backend)</text>
<rect fill="#555" height="60" rx="6" stroke="#555" width="130" x="680" y="80"></rect>
<text text-anchor="middle" x="745" y="106">Model endpoint</text><text fill="#555" text-anchor="middle" x="745" y="124">Ollama / watsonx</text>
</g>
<g fill="none" marker-end="url(#ar)" stroke="#555" stroke-width="1.5">
<line x1="120" x2="158" y1="110" y2="110"></line><line x1="300" x2="358" y1="110" y2="110"></line>
<line x1="480" x2="498" y1="110" y2="110"></line><line x1="625" x2="678" y1="110" y2="110"></line>
</g>
<g fill="#555" font-size="11">
<text x="160" y="160">⚠ buffering / 60s idle cut</text>
<text x="10" y="235">⚠ sync SDK call inside async def blocks the event loop</text>
<text x="420" y="235">⚠ non-streaming step (RunnableLambda) flushes all at end</text>
</g>
</svg>