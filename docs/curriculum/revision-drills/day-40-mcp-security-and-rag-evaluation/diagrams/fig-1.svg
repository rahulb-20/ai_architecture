<rect class="w" height="36" width="170" x="400" y="178"></rect><text text-anchor="middle" x="485" y="201">Approval page (URL mode)</text>
<rect class="b" height="40" width="140" x="620" y="16"></rect><text text-anchor="middle" x="690" y="41">Hybrid index</text>
<rect class="b" height="40" width="140" x="620" y="66"></rect><text text-anchor="middle" x="690" y="91">Claims system</text>
<rect class="b" height="40" width="140" x="620" y="116"></rect><text text-anchor="middle" x="690" y="141">Policy admin + ledger</text>
<path class="l" d="M140 82H188" marker-end="url(#a)"></path>
<path class="l" d="M340 72L398 38" marker-end="url(#a)"></path><path class="l" d="M340 82L398 86" marker-end="url(#a)"></path><path class="l" d="M340 94L398 134" marker-end="url(#a)"></path>
