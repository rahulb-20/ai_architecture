<rect class="b" height="60" width="120" x="20" y="52"></rect><text text-anchor="middle" x="80" y="78">Copilot host</text><text class="s" text-anchor="middle" x="80" y="95">user token, MRTR loop</text>
<rect class="k" height="60" width="150" x="190" y="52"></rect><text text-anchor="middle" x="265" y="78">MCP gateway</text><text class="s" text-anchor="middle" x="265" y="95">authn, tool RBAC, audit</text>
