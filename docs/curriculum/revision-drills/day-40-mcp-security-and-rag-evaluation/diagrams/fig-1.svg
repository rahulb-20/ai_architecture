<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Copilot calls an MCP gateway that routes to retrieval, claims and endorsement servers. Endorsement writes need out-of-band approval. Traces feed an evaluation pipeline that ends in a release gate." role="img" style="background:#ffffff" viewbox="0 0 780 372" xmlns="http://www.w3.org/2000/svg">
