<path class="l" d="M485 156V176" marker-end="url(#a)"></path>
<rect class="band" height="104" width="760" x="10" y="238"></rect>
<text class="s" x="104" y="256">Evaluation path</text>
<path class="l" d="M265 112V226H86V266" marker-end="url(#a)"></path>
<text class="s" x="274" y="222">OTel traces, masked</text>
<rect class="b" height="56" width="132" x="20" y="268"></rect><text text-anchor="middle" x="86" y="292">Trace store</text><text class="s" text-anchor="middle" x="86" y="309">sampled by segment</text>
<rect class="b" height="56" width="132" x="172" y="268"></rect><text text-anchor="middle" x="238" y="292">Golden sets</text><text class="s" text-anchor="middle" x="238" y="309">per persona, pinned</text>
<rect class="b" height="56" width="132" x="324" y="268"></rect><text text-anchor="middle" x="390" y="292">Deterministic</text><text class="s" text-anchor="middle" x="390" y="309">ACL, IDs, citations</text>
