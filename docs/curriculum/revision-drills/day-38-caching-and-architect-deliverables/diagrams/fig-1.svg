<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Request path with exact cache, semantic cache, and provider prefix cache" role="img" style="background:#ffffff" viewbox="0 0 720 250" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#5a6476"></path></marker></defs>
<rect fill="#e3eef9" height="56" rx="6" stroke="#0f62a8" width="92" x="8" y="90"></rect>
<text fill="#1b2230" font-size="13" font-weight="600" text-anchor="middle" x="54" y="114">Request</text>
<text fill="#5a6476" font-size="11" text-anchor="middle" x="54" y="132">user + scope</text>
<line marker-end="url(#ar)" stroke="#5a6476" x1="100" x2="140" y1="118" y2="118"></line>
<rect fill="#ffffff" height="56" rx="6" stroke="#dde2ea" width="120" x="142" y="90"></rect>
<text fill="#1b2230" font-size="13" font-weight="600" text-anchor="middle" x="202" y="113">1 · Exact cache</text>
<text fill="#5a6476" font-size="11" text-anchor="middle" x="202" y="131">hash(prompt+params)</text>
<line marker-end="url(#ar)" stroke="#5a6476" x1="262" x2="302" y1="118" y2="118"></line>
<rect fill="#ffffff" height="56" rx="6" stroke="#dde2ea" width="136" x="304" y="90"></rect>
<text fill="#1b2230" font-size="13" font-weight="600" text-anchor="middle" x="372" y="113">2 · Semantic cache</text>
<text fill="#5a6476" font-size="11" text-anchor="middle" x="372" y="131">cos ≥ τ, same scope</text>
<line marker-end="url(#ar)" stroke="#5a6476" x1="440" x2="480" y1="118" y2="118"></line>
<rect fill="#ffffff" height="80" rx="6" stroke="#0f62a8" width="228" x="482" y="78"></rect>
<text fill="#1b2230" font-size="13" font-weight="600" text-anchor="middle" x="596" y="100">3 · LLM provider</text>
<rect fill="#e2f3ea" height="36" rx="4" stroke="#1f7a4d" width="112" x="494" y="110"></rect>
<text fill="#1b2230" font-size="11" text-anchor="middle" x="550" y="126">static prefix</text>
<text fill="#5a6476" font-size="10" text-anchor="middle" x="550" y="140">prompt-cached</text>
<rect fill="#fbefe0" height="36" rx="4" stroke="#a4570a" width="90" x="610" y="110"></rect>
<text fill="#1b2230" font-size="11" text-anchor="middle" x="655" y="126">dynamic tail</text>
<text fill="#5a6476" font-size="10" text-anchor="middle" x="655" y="140">full price</text>
<text fill="#1f7a4d" font-size="11" text-anchor="middle" x="202" y="178">hit → skips everything</text>
<text fill="#5a6476" font-size="11" text-anchor="middle" x="202" y="194">risk: low hit rate</text>
<text fill="#1f7a4d" font-size="11" text-anchor="middle" x="372" y="178">hit → skips LLM + retrieval</text>
<text fill="#a4570a" font-size="11" text-anchor="middle" x="372" y="194">risk: wrong answer served</text>
<text fill="#1f7a4d" font-size="11" text-anchor="middle" x="596" y="178">hit → cheaper, faster prefill</text>
<text fill="#5a6476" font-size="11" text-anchor="middle" x="596" y="194">risk: none to correctness</text>
<text fill="#5a6476" font-size="12" text-anchor="middle" x="360" y="234">Order: tools → system → few-shot (stable) … retrieved chunks → user turn (volatile)</text>
</svg>