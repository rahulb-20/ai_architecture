<!-- footer notes -->
<text fill="#555" font-size="11" x="130" y="306">A: cheap index, weak on charts  ·  B: best default for mixed corpora</text><text fill="#555" font-size="11" x="130" y="322">C: no parsing, but a heavy index and no text for BM25 or ACL redaction</text>
