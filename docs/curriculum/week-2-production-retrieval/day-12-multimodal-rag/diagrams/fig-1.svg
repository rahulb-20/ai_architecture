<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" style="background:#ffffff" viewbox="0 0 760 336" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"></path></marker></defs>
<g fill="#555" font-size="12">
