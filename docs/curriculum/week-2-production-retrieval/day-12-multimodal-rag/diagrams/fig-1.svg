<line marker-end="url(#ar)" stroke="#555" x1="258" x2="288" y1="166" y2="174"></line>
<line marker-end="url(#ar)" stroke="#555" x1="418" x2="448" y1="142" y2="152"></line>
<line marker-end="url(#ar)" stroke="#555" x1="418" x2="448" y1="175" y2="166"></line>
<line marker-end="url(#ar)" stroke="#555" x1="578" x2="608" y1="158" y2="158"></line>
