<text text-anchor="middle" x="194" y="155">Typed elements</text><text text-anchor="middle" x="194" y="170">text · table · figure</text>
<rect fill="#555" height="26" rx="4" stroke="#555" width="128" x="290" y="128"></rect>
<text text-anchor="middle" x="354" y="145">summary → index</text>
