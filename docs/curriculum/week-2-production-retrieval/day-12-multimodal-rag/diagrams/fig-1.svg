<text fill="#555" font-weight="600" x="10" y="58">A · Parse → text</text>
<text fill="#555" font-weight="600" x="10" y="158">B · Multi-vector</text>
<text fill="#555" font-weight="600" x="10" y="258">C · Vision-native</text>
