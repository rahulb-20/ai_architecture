<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-labelledby="dT dD" height="340" role="img" style="background:#ffffff" viewbox="0 0 840 340" width="840" xmlns="http://www.w3.org/2000/svg">

<desc id="dD">A query enters a router. Simple queries go straight to hybrid retrieval. Constrained or vague queries pass through a transform step (rewrite, multi-query, HyDE, self-query) first. Global questions go to a GraphRAG index. Retrieved chunks are graded: relevant goes to generation, irrelevant loops back to rewrite at most once, and after the retry budget the system abstains.</desc>
