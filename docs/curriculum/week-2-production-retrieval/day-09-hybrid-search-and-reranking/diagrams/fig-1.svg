<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-labelledby="dgT dgD" height="300" role="img" style="background:#ffffff" viewbox="0 0 820 300" width="820" xmlns="http://www.w3.org/2000/svg">

<desc id="dgD">The query fans out to BM25 and a dense ANN index in parallel; each returns about 50 candidates; RRF fuses them; a cross-encoder reranks the top 20 to 50; the top 5 to 8 go into the LLM prompt.</desc>
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" style="fill:#555"></path></marker></defs>
<g marker-end="url(#ar)" style="stroke:#555;stroke-width:1.4;fill:none">
<path d="M118,150 C150,150 150,80 186,80"></path><path d="M118,150 C150,150 150,220 186,220"></path>
<path d="M346,80 C380,80 380,150 412,150"></path><path d="M346,220 C380,220 380,150 412,150"></path>
<path d="M532,150 L566,150"></path><path d="M700,150 L728,150"></path>
</g>
<rect height="56" rx="5" style="fill:#555;stroke:#555" width="108" x="10" y="122"></rect>
<text style="fill:#555;font-size:13px" text-anchor="middle" x="64" y="146">query</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="64" y="164">+ ACL filter</text>
<rect height="60" rx="5" style="fill:#555;stroke:#555" width="158" x="188" y="50"></rect>
<text style="fill:#555;font-size:13px;font-weight:500" text-anchor="middle" x="267" y="74">BM25 / sparse</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="267" y="93">inverted index · top 50</text>
<rect height="60" rx="5" style="fill:#555;stroke:#555" width="158" x="188" y="190"></rect>
<text style="fill:#555;font-size:13px;font-weight:500" text-anchor="middle" x="267" y="214">dense ANN</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="267" y="233">HNSW · top 50</text>
<rect height="64" rx="5" style="fill:#555;stroke:#555" width="118" x="414" y="118"></rect>
<text style="fill:#555;font-size:13px;font-weight:500" text-anchor="middle" x="473" y="143">RRF fuse</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="473" y="162">Σ w/(k+rank)</text>
<rect height="64" rx="5" style="fill:#555;stroke:#555" width="132" x="568" y="118"></rect>
<text style="fill:#555;font-size:13px;font-weight:500" text-anchor="middle" x="634" y="143">cross-encoder</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="634" y="162">rerank top 20–50</text>
<rect height="56" rx="5" style="fill:#555;stroke:#555" width="80" x="730" y="122"></rect>
<text style="fill:#555;font-size:13px" text-anchor="middle" x="770" y="146">LLM</text>
<text style="fill:#555;font-size:10.5px" text-anchor="middle" x="770" y="164">top 5–8</text>
<g style="font-size:10.5px">
<text style="fill:#555" text-anchor="middle" x="267" y="30">~5–20 ms</text>
<text style="fill:#555" text-anchor="middle" x="267" y="276">embed q ~5–30 ms + ANN ~5–20 ms</text>
<text style="fill:#555" text-anchor="middle" x="473" y="206">&lt;1 ms</text>
<text style="fill:#555" text-anchor="middle" x="634" y="206">GPU ~20–80 ms · CPU 100 ms+</text>
<text style="fill:#555" text-anchor="middle" x="410" y="292">stage 1: recall-oriented, run in parallel  ·  stage 2: precision-oriented, cost scales with candidates × tokens</text>
</g>
</svg>