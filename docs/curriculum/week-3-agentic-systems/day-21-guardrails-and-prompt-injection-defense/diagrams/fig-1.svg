<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Guarded agent pipeline: input guard, agent, tool gate with MCP server, output guard" role="img" style="min-width:600px;background:#ffffff" viewbox="0 0 720 330" width="100%" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0 0L10 5L0 10z" fill="#555"></path></marker></defs>
<g font-size="12">
<rect fill="#555" height="54" rx="8" stroke="#555" width="80" x="10" y="40"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="50" y="72">User</text>
<rect fill="#555" height="90" rx="8" stroke="#555" width="140" x="120" y="22"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="190" y="42">① input_guard</text>
<text fill="#555" text-anchor="middle" x="190" y="62">regex heuristics</text>
<text fill="#555" text-anchor="middle" x="190" y="78">Llama Guard 3 (1B)</text>
<text fill="#555" text-anchor="middle" x="190" y="94">Presidio PII mask</text>
<rect fill="#555" height="90" rx="8" stroke="#555" width="140" x="290" y="22"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="360" y="48">agent (LLM)</text>
<text fill="#555" text-anchor="middle" x="360" y="68">qwen3:4b via Ollama</text>
<text fill="#555" text-anchor="middle" x="360" y="84">untrusted planner</text>
<rect fill="#555" height="90" rx="8" stroke="#555" width="150" x="460" y="22"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="535" y="42">② tool_gate</text>
<text fill="#555" text-anchor="middle" x="535" y="62">allowlist + arg policy</text>
<text fill="#555" text-anchor="middle" x="535" y="78">taint → interrupt()</text>
<text fill="#555" text-anchor="middle" x="535" y="94">③ spotlight output</text>
<rect fill="#555" height="64" rx="8" stroke="#555" width="130" x="470" y="200"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="535" y="226">MCP server</text>
<text fill="#555" text-anchor="middle" x="535" y="244">stdio · policy-kb</text>
<rect fill="#555" height="64" rx="8" stroke="#555" width="140" x="290" y="200"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="360" y="224">Human approver</text>
<text fill="#555" text-anchor="middle" x="360" y="242">side effects after taint</text>
<rect fill="#555" height="64" rx="8" stroke="#555" width="140" x="120" y="200"></rect>
<text fill="#555" font-weight="600" text-anchor="middle" x="190" y="224">④ output_guard</text>
<text fill="#555" text-anchor="middle" x="190" y="242">canary leak · PII scrub</text>
<line marker-end="url(#ar)" stroke="#555" x1="90" x2="118" y1="67" y2="67"></line>
<line marker-end="url(#ar)" stroke="#555" x1="260" x2="288" y1="67" y2="67"></line>
<line marker-end="url(#ar)" stroke="#555" x1="430" x2="458" y1="56" y2="56"></line>
<line marker-end="url(#ar)" stroke="#555" x1="458" x2="432" y1="82" y2="82"></line>
<text fill="#555" font-size="11" text-anchor="middle" x="444" y="128">tool calls / results</text>
<line marker-end="url(#ar)" stroke="#555" x1="545" x2="545" y1="112" y2="198"></line>
<line marker-end="url(#ar)" stroke="#555" stroke-dasharray="4 3" x1="525" x2="525" y1="198" y2="114"></line>
<text fill="#555" font-size="11" x="618" y="160">untrusted data</text>
<text fill="#555" font-size="11" x="618" y="174">(sets tainted=true)</text>
<line marker-end="url(#ar)" stroke="#555" stroke-dasharray="4 3" x1="490" x2="410" y1="112" y2="198"></line>
<line marker-end="url(#ar)" stroke="#555" x1="330" x2="230" y1="112" y2="198"></line>
<text fill="#555" font-size="11" x="236" y="150">final answer</text>
<line stroke="#555" x1="120" x2="52" y1="232" y2="232"></line>
<line marker-end="url(#ar)" stroke="#555" x1="50" x2="50" y1="232" y2="96"></line>
</g>
<text fill="#555" font-size="12" x="10" y="300">Deterministic layers (② allowlist, arg policy, taint, approval) are the security boundary.</text>
<text fill="#555" font-size="12" x="10" y="318">Probabilistic layers (① classifiers, ③ spotlighting, ④ scrubbing) reduce noise and blast radius; they are not proofs.</text>
</svg>