<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Memory architecture: request flows through recall, LLM call, and a background writer, backed by a checkpointer and a long-term store" role="img" style="background:#ffffff" viewbox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
