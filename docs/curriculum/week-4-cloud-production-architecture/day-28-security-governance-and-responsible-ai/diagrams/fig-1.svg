<rect class="svg-ctl" height="40" rx="8" width="105" x="515" y="180"></rect><text class="svg-t" text-anchor="middle" x="567" y="198">Tools / MCP</text><text class="svg-s" text-anchor="middle" x="567" y="212">scoped creds · HITL · LLM06</text>
