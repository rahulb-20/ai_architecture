<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="Defense-in-depth request path for a GenAI application with control points mapped to OWASP LLM risks" role="img" style="background:#ffffff" viewbox="0 0 760 330" xmlns="http://www.w3.org/2000/svg">
<defs><marker id="ar" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path class="svg-ac" d="M0,0 L10,5 L0,10 z"></path></marker></defs>
<!-- trust boundary -->
<rect class="svg-bd" height="210" rx="10" width="605" x="140" y="20"></rect>
<text class="svg-s" x="152" y="38">PRIVATE NETWORK · private endpoints · egress allow-list</text>
<!-- user -->
<rect class="svg-box" height="56" rx="8" width="100" x="12" y="95"></rect><text class="svg-t" text-anchor="middle" x="62" y="120">User</text><text class="svg-s" text-anchor="middle" x="62" y="138">SSO / OIDC</text>
<!-- stages -->
<g>
<rect class="svg-ctl" height="86" rx="8" width="105" x="155" y="80"></rect><text class="svg-t" text-anchor="middle" x="207" y="104">Gateway</text><text class="svg-s" text-anchor="middle" x="207" y="122">authN, quota</text><text class="svg-s" text-anchor="middle" x="207" y="137">WAF, rate limit</text><text class="svg-s" text-anchor="middle" x="207" y="155">LLM10</text>
<rect class="svg-ctl" height="86" rx="8" width="105" x="275" y="80"></rect><text class="svg-t" text-anchor="middle" x="327" y="104">Input policy</text><text class="svg-s" text-anchor="middle" x="327" y="122">PII mask</text><text class="svg-s" text-anchor="middle" x="327" y="137">injection clf</text><text class="svg-s" text-anchor="middle" x="327" y="155">LLM01 · LLM02</text>
<rect class="svg-ctl" height="86" rx="8" width="105" x="395" y="80"></rect><text class="svg-t" text-anchor="middle" x="447" y="104">Retrieval</text><text class="svg-s" text-anchor="middle" x="447" y="122">ACL pre-filter</text><text class="svg-s" text-anchor="middle" x="447" y="137">tenant isolation</text><text class="svg-s" text-anchor="middle" x="447" y="155">LLM08</text>
<rect class="svg-box" height="86" rx="8" width="105" x="515" y="80"></rect><text class="svg-t" text-anchor="middle" x="567" y="104">Model</text><text class="svg-s" text-anchor="middle" x="567" y="122">no-train, region</text><text class="svg-s" text-anchor="middle" x="567" y="137">pinned version</text><text class="svg-s" text-anchor="middle" x="567" y="155">LLM03 · LLM04</text>
<rect class="svg-ctl" height="86" rx="8" width="105" x="635" y="80"></rect><text class="svg-t" text-anchor="middle" x="687" y="104">Output policy</text><text class="svg-s" text-anchor="middle" x="687" y="122">leak, PII, safety</text><text class="svg-s" text-anchor="middle" x="687" y="137">encode before use</text><text class="svg-s" text-anchor="middle" x="687" y="155">LLM05 · 07 · 09</text>
</g>
<path class="svg-ln" d="M112 123 H153" marker-end="url(#ar)"></path><path class="svg-ln" d="M260 123 H273" marker-end="url(#ar)"></path><path class="svg-ln" d="M380 123 H393" marker-end="url(#ar)"></path><path class="svg-ln" d="M500 123 H513" marker-end="url(#ar)"></path><path class="svg-ln" d="M620 123 H633" marker-end="url(#ar)"></path>
