<svg font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" aria-label="GenAI delivery pipeline: PR checks, merge, nightly live eval, progressive deploy with online analysis, and rollback paths" role="img" style="background:#ffffff" viewbox="0 0 980 330" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ar" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"></path></marker>
<marker id="arf" markerheight="7" markerwidth="7" orient="auto-start-reverse" refx="9" refy="5" viewbox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#555"></path></marker>
</defs>
<text fill="#555" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.2" x="20" y="26">PULL REQUEST · minutes · ~free</text>
<text fill="#555" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1.2" x="520" y="26">RELEASE · hours · real traffic</text>
<line stroke="#555" stroke-dasharray="4 4" x1="500" x2="500" y1="14" y2="316"></line>
<g fill="#555" font-family="IBM Plex Sans, sans-serif" font-size="13">
<rect fill="#555" height="62" rx="8" stroke="#555" width="140" x="20" y="44"></rect>
<text font-weight="600" x="34" y="68">Change</text><text fill="#555" font-size="12" x="34" y="88">prompt · model · RAG cfg</text>
<rect fill="#555" height="62" rx="8" stroke="#555" width="130" x="190" y="44"></rect>
<text font-weight="600" x="204" y="68">Unit + schema</text><text fill="#555" font-size="12" x="204" y="88">pytest, no LLM</text>
<rect fill="#555" height="62" rx="8" stroke="#555" width="130" x="350" y="44"></rect>
<text font-weight="600" x="364" y="68">Eval gate</text><text fill="#555" font-size="12" x="364" y="88">replay / small judge</text>
<rect fill="#555" height="62" rx="8" stroke="#555" width="130" x="520" y="44"></rect>
<text font-weight="600" x="534" y="68">Full eval</text><text fill="#555" font-size="12" x="534" y="88">live, LLM-as-judge</text>
<rect fill="#555" height="62" rx="8" stroke="#555" width="130" x="680" y="44"></rect>
<text font-weight="600" x="694" y="68">Staging</text><text fill="#555" font-size="12" x="694" y="88">shadow traffic</text>
<rect fill="#555" height="62" rx="8" stroke="#555" width="120" x="840" y="44"></rect>
<text font-weight="600" x="854" y="68">Progressive</text><text fill="#555" font-size="12" x="854" y="88">5% → 25% → 100%</text>
</g>
<g fill="none" stroke="#555" stroke-width="1.5">
<line marker-end="url(#ar)" x1="160" x2="186" y1="75" y2="75"></line>
<line marker-end="url(#ar)" x1="320" x2="346" y1="75" y2="75"></line>
<line marker-end="url(#ar)" x1="480" x2="516" y1="75" y2="75"></line>
<line marker-end="url(#ar)" x1="650" x2="676" y1="75" y2="75"></line>
<line marker-end="url(#ar)" x1="810" x2="836" y1="75" y2="75"></line>
</g>
<g fill="none" stroke="#555" stroke-dasharray="5 4" stroke-width="1.5">
<path d="M415 106 V150 H90 V110" marker-end="url(#arf)"></path>
<path d="M900 106 V196 H760" marker-end="url(#arf)"></path>
</g>
<text fill="#555" font-family="IBM Plex Mono, monospace" font-size="12" x="140" y="168">fail → PR blocked, report posted as comment</text>
<rect fill="#555" height="56" rx="8" stroke="#555" width="200" x="560" y="176"></rect>
<text fill="#555" font-family="IBM Plex Sans, sans-serif" font-size="13" font-weight="600" x="574" y="199">Rollback</text>
<text fill="#555" font-family="IBM Plex Sans, sans-serif" font-size="12" x="574" y="218">alias → previous version</text>
<text fill="#555" font-family="IBM Plex Mono, monospace" font-size="11.5" x="776" y="226">online metric breach</text>
<g fill="#555" font-family="IBM Plex Sans, sans-serif" font-size="12.5">
<text x="20" y="262">Release unit = (code sha, prompt version, model snapshot, retrieval config). Every trace carries all four ids.</text>
<text x="20" y="284">Online analysis on the canary: thumbs-down rate, groundedness sample, refusal rate, p95 latency, tokens/request, error rate.</text>
<text x="20" y="306">Prompt-only changes skip the image build: they promote by moving an alias in the registry.</text>
</g>
</svg>