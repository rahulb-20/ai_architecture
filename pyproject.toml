[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aiarch"
version = "0.1.0"
description = "Self-sufficient GenAI reference architecture boilerplate: gateway, hybrid RAG, guardrails, agents, evals, observability."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rahul Bhave" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
local-models = ["sentence-transformers>=3"]

[project.scripts]
aiarch = "aiarch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aiarch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs/curriculum"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["src/aiarch"]
